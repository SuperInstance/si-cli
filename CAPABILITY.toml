# CAPABILITY.toml — si-cli
# Unified CLI for the SuperInstance ecosystem

name = "si-cli"
version = "0.1.0"
description = "Unified CLI: scans CAPABILITY.toml, verifies conservation laws, ranks repos, audits ecosystem readiness, syncs to Supabase"

provides = [
    "cli-scanner",
    "conservation-checker",
    "spectral-ranking",
    "dependency-graph",
    "ecosystem-audit",
    "integration-suggestions",
    "capability-template-generator",
    "supabase-fleet-sync",
]

requires = [
    "supabase-rest-client",
    "fleet-budget-data",
    "capability-toml-schema",
]
